<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/logo-macajou.png">
<link rel="apple-touch-icon" href="/assets/logo-macajou.png">
<title>Composer mon coffret — Macajou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shop.css">
<style>
.compose{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3rem;align-items:start}
.compose-visual{background:var(--creme-2);aspect-ratio:4/5;overflow:hidden;position:sticky;top:110px}
.compose-visual img{width:100%;height:100%;object-fit:cover}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brun);margin-bottom:.7rem}
.compose h1{font-family:var(--display);font-weight:500;font-size:clamp(1.8rem,3vw,2.6rem);line-height:1.15;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.6rem}
.compose .price{font-family:var(--display);font-size:1.45rem;margin:1rem 0 1.4rem}
.compose .lead{opacity:.8;max-width:42ch;line-height:1.55;margin-bottom:1.6rem}
.field-label{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.55rem;display:block}
.switcher select{width:100%;padding:.85rem 1rem;border:1px solid var(--line);background:#fff;font:inherit;margin-bottom:1.6rem}
.flavor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin-bottom:1.4rem}
.flavor-opt{display:flex;align-items:center;gap:.75rem;padding:.85rem 1rem;border:1px solid var(--line);background:#fff;cursor:pointer;transition:border-color .2s,background .2s}
.flavor-opt:hover{border-color:var(--encre)}
.flavor-opt.is-on{border-color:var(--encre);background:#f3eee3}
.flavor-opt input{width:auto;accent-color:var(--rouge)}
.flavor-opt .name{font-size:.95rem}
.summary-box{background:#fff;border:1px solid var(--line);padding:1rem 1.15rem;margin-bottom:1.2rem;font-size:.92rem;line-height:1.5}
.summary-box strong{font-family:var(--display);font-size:1.05rem;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center}
.hint{font-size:.85rem;opacity:.7;margin-top:.9rem}
.error-box{padding:4rem 0;text-align:center;font-family:var(--display);font-size:1.4rem}
@media(max-width:900px){
  .compose{grid-template-columns:1fr;gap:1.8rem}
  .compose-visual{position:static;aspect-ratio:5/4}
  .flavor-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="shop-top">Composez votre coffret Macajou</div>
<header class="shop-nav">
  <nav class="links left">
    <a href="/#collection">E-Shop</a>
    <a href="/">Accueil</a>
  </nav>
  <a class="logo" href="/">Macajou</a>
  <nav class="links right">
    <a href="/panier.html" class="cart-link">
      Panier
      <span class="cart-count" data-cart-count hidden>0</span>
    </a>
  </nav>
</header>

<main class="shop-wrap">
  <div id="state" class="error-box">Chargement…</div>
  <div id="compose" class="compose" hidden></div>
</main>

<script src="/js/cart.js"></script>
<script src="/js/composer.js"></script>
</body>
</html>
