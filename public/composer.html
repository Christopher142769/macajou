<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/logo-macajou.png">
<link rel="apple-touch-icon" href="/assets/logo-macajou.png">
<title>Composer mon coffret, Macajou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shop.css">
<style>
.compose{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:2.5rem;align-items:start}
.compose > *{min-width:0}
.compose-visual{background:var(--creme-2);aspect-ratio:4/5;overflow:hidden;position:sticky;top:110px}
.compose-visual img{width:100%;height:100%;object-fit:cover;display:block}
.compose-badge{position:absolute;top:14px;left:14px;z-index:2;background:var(--rouge);color:var(--creme);font-family:var(--body);font-style:normal;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:.4rem .75rem}
.compose .info-badge{display:inline-block;background:var(--rouge);color:var(--creme);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:.35rem .7rem;margin:0 0 .75rem}
.trust-toggle{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.15rem;border:1px solid var(--line);background:#fff;margin:0 0 1.2rem;cursor:pointer;user-select:none}
.trust-toggle-text{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.trust-toggle-text strong{font-size:.92rem;font-weight:500}
.trust-toggle-text em{font-style:normal;font-size:.82rem;opacity:.68;line-height:1.4}
.trust-toggle input{position:absolute;opacity:0;pointer-events:none}
.trust-switch{position:relative;flex:0 0 48px;width:48px;height:28px;border-radius:999px;background:#d9d1c3;transition:background .2s}
.trust-switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .2s}
.trust-toggle input:checked + .trust-switch{background:var(--rouge)}
.trust-toggle input:checked + .trust-switch::after{transform:translateX(20px)}
.trust-toggle:focus-within{outline:2px solid var(--rouge);outline-offset:2px}
.trust-ready{font-size:.95rem;line-height:1.5;opacity:.82;padding:1rem 1.15rem;border:1px solid var(--line);background:var(--creme-2);margin:0 0 1.2rem}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brun);margin-bottom:.7rem}
.compose h1{font-family:var(--display);font-weight:500;font-size:clamp(1.55rem,5vw,2.5rem);line-height:1.15;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.4rem;word-break:break-word}
.compose .price{font-family:var(--display);font-size:clamp(1.2rem,3.5vw,1.4rem);margin:.8rem 0 1rem}
.compose .lead{opacity:.8;max-width:44ch;line-height:1.55;margin-bottom:1.2rem}
.field-label{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.55rem;display:block}
.switcher select{width:100%;max-width:100%;padding:.85rem 1rem;border:1px solid var(--line);background:#fff;font:inherit;margin-bottom:1.2rem}
.meter{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.75rem 1rem;padding:1rem 1.15rem;border:1px solid var(--line);background:#fff;margin-bottom:1.2rem}
.meter strong{font-family:var(--display);font-size:1.35rem}
.meter .ok{color:#1a7a3c}
.meter .over{color:var(--rouge)}
.meter-bar{height:8px;background:#ebe4d6;border-radius:999px;overflow:hidden;min-width:0}
.meter-bar > span{display:block;height:100%;background:var(--rouge);width:0;transition:width .25s}
.meter-rest{font-size:.85rem;opacity:.75;text-align:right;white-space:nowrap}
.mac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.9rem;margin-bottom:1.4rem}
.mac-card{background:#fff;border:1px solid var(--line);padding:.85rem;text-align:center;display:flex;flex-direction:column;gap:.55rem;min-width:0}
.mac-card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--creme-2)}
.mac-card .ph{width:100%;aspect-ratio:1;background:linear-gradient(145deg,#f3eee3,#e8dfd0);display:grid;place-items:center;font-family:var(--script);font-size:1.6rem;color:var(--brun)}
.mac-card .name{font-size:.9rem;line-height:1.3;min-height:2.4em}
.qty{display:flex;align-items:center;justify-content:center;gap:.35rem}
.qty button{width:36px;height:36px;border:1px solid var(--line);background:var(--creme);cursor:pointer;font-size:1.15rem;line-height:1;flex-shrink:0;touch-action:manipulation}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.qty span{min-width:1.4rem;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center}
.actions .btn{flex:1 1 auto}
.hint{font-size:.85rem;opacity:.7;margin-top:.9rem}
.limited-note{font-size:.88rem;line-height:1.45;opacity:.78;border-left:2px solid var(--rouge);padding-left:.85rem;margin:.2rem 0 .9rem;max-width:46ch}
.error-box{padding:4rem 0;text-align:center;font-family:var(--display);font-size:1.4rem}
.after-add{position:fixed;inset:0;z-index:300;background:rgba(28,22,17,.45);display:grid;place-items:center;padding:1.2rem;opacity:0;pointer-events:none;transition:opacity .25s}
.after-add.show{opacity:1;pointer-events:auto}
.after-add-card{background:var(--creme);border:1px solid var(--line);padding:2rem 1.6rem;max-width:420px;width:100%;text-align:center}
.after-add-eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--brun);margin-bottom:.55rem}
.after-add-card h2{font-family:var(--display);font-weight:500;font-size:1.65rem;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.55rem}
.after-add-lead{opacity:.75;line-height:1.5;margin-bottom:1.4rem;font-size:.95rem}
.after-add-actions{display:flex;flex-direction:column;gap:.65rem}
.after-add-close{margin-top:1rem;background:none;border:none;text-decoration:underline;cursor:pointer;font:inherit;opacity:.65;font-size:.88rem}
.mac-scroll-hint{display:none;font-size:.78rem;opacity:.55;margin:-.35rem 0 .55rem;letter-spacing:.04em}
@media(max-width:900px){
  .compose{grid-template-columns:1fr;gap:1.4rem}
  .compose-visual{position:static;aspect-ratio:4/5;width:100%;max-height:none}
  .compose-visual img{object-position:center;width:100%;height:100%}
  .meter{grid-template-columns:1fr 1fr;gap:.55rem .8rem;padding:.9rem 1rem}
  .meter-bar{grid-column:1 / -1;order:3}
  .meter-rest{text-align:right}
  .mac-scroll-hint{display:block}
  .mac-grid{
    display:flex;
    flex-wrap:nowrap;
    gap:.75rem;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x mandatory;
    padding:0 0 .75rem;
    margin:0 -1.1rem 1.2rem;
    padding-left:1.1rem;
    padding-right:1.1rem;
    scrollbar-width:thin;
  }
  .mac-grid::-webkit-scrollbar{height:3px}
  .mac-grid::-webkit-scrollbar-thumb{background:rgba(28,22,17,.22)}
  .mac-card{
    flex:0 0 132px;
    width:132px;
    scroll-snap-align:start;
    padding:.7rem;
  }
  .mac-card .name{min-height:2.4em;font-size:.82rem}
  .actions{flex-direction:column;align-items:stretch}
  .actions .btn{width:100%;flex:none}
}
@media(max-width:480px){
  .compose-visual{aspect-ratio:4/5}
  .mac-card{flex-basis:120px;width:120px}
}
</style>
</head>
<body>
<div class="shop-top">Composez votre coffret, capacité stricte</div>
<header class="shop-nav">
  <nav class="links left">
    <a href="/">← Accueil</a>
    <a href="/#collection">Coffrets</a>
  </nav>
  <a class="logo" href="/" aria-label="Macajou, Accueil">
    <img src="/assets/logo-macajou.png" alt="Macajou">
  </a>
  <nav class="links right">
    <a class="shop-home" href="/">Retour à l’accueil</a>
    <a href="/panier.html" class="cart-link">
      Panier
      <span class="cart-count" data-cart-count hidden>0</span>
    </a>
  </nav>
</header>

<main class="shop-wrap">
  <div id="state" class="error-box">Chargement…</div>
  <div id="compose" class="compose" hidden></div>
</main>

<script src="/js/cart.js?v=20260804-limited-photo"></script>
<script src="/js/composer.js?v=20260804-pyramides-modal"></script>
</body>
</html>
